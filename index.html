<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDO - Energy Domain Ontology Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: rgba(0,0,0,0.4);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 20px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header .version {
            background: rgba(124,58,237,0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #a78bfa;
        }
        
        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .github-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #888;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }
        
        .github-link:hover { color: #00d4ff; }
        
        /* Tabs */
        .tabs-container {
            background: rgba(0,0,0,0.3);
            padding: 0 20px;
            display: flex;
            gap: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
        
        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }
        
        .tab-icon { font-size: 16px; }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        
        /* Dashboard Styles */
        .dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .dashboard-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .dashboard-card h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .big-number {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .big-number-label {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .stat-row:last-child { border-bottom: none; }
        
        .stat-row .label { color: #888; font-size: 13px; }
        .stat-row .value { color: #fff; font-weight: 600; }
        
        .mini-chart {
            height: 150px;
            margin-top: 10px;
        }
        
        .chart-container {
            height: 300px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
        }
        
        .chart-title {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        /* Progress bars */
        .progress-item {
            margin-bottom: 12px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        .progress-label { color: #ccc; }
        .progress-value { color: #00d4ff; font-weight: 600; }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        /* Table styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        .data-table th {
            text-align: left;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        
        .data-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .data-table tr:hover {
            background: rgba(255,255,255,0.03);
        }
        
        .table-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
        }
        
        /* Search and filters */
        .dashboard-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
        }
        
        .search-input::placeholder { color: #666; }
        .search-input:focus { outline: none; border-color: #00d4ff; }
        
        .filter-btn {
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .filter-btn:hover { background: rgba(255,255,255,0.1); }
        .filter-btn.active { background: #7c3aed; border-color: #7c3aed; }
        
        /* Graph tab styles */
        .graph-controls {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.2);
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: all 0.2s;
        }
        
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.active { background: linear-gradient(90deg, #00d4ff, #7c3aed); border-color: transparent; }
        
        .legend {
            display: flex;
            gap: 15px;
            margin-left: auto;
            font-size: 11px;
        }
        
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }
        
        .graph-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        #graph { width: 100%; height: 100%; }
        
        /* Info Panel */
        .info-panel {
            width: 380px;
            background: rgba(0,0,0,0.5);
            border-left: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            transition: all 0.3s;
        }
        
        .info-panel.collapsed { width: 0; padding: 0; overflow: hidden; }
        
        .panel-toggle {
            position: absolute;
            right: 380px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 15px 6px;
            cursor: pointer;
            border-radius: 6px 0 0 6px;
            z-index: 100;
            transition: all 0.3s;
        }
        
        .panel-toggle.collapsed { right: 0; }
        
        .panel-content { padding: 20px; }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #666;
            text-align: center;
        }
        
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }
        
        .panel-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .panel-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .panel-title h2 {
            font-size: 16px;
            color: #00d4ff;
            margin-bottom: 4px;
            word-break: break-word;
        }
        
        .panel-title .class-id {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }
        
        .info-section { margin-bottom: 20px; }
        
        .info-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7c3aed;
            margin-bottom: 10px;
        }
        
        .info-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .info-item label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
        
        .info-item .value {
            font-size: 13px;
            color: #fff;
            line-height: 1.5;
        }
        
        .info-item .value.uri {
            font-size: 11px;
            color: #00d4ff;
            font-family: monospace;
            word-break: break-all;
        }
        
        .ifc-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .ifc-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .ifc-detail {
            background: rgba(124,58,237,0.15);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .ifc-detail label {
            color: #a78bfa;
            font-size: 10px;
            display: block;
            margin-bottom: 2px;
        }
        
        .category-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tag {
            display: inline-block;
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px;
        }
        
        .tag.discipline { background: rgba(16,185,129,0.15); color: #10b981; }
        .tag.status { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .tag.unit { background: rgba(236,72,153,0.15); color: #ec4899; }
        .tag.ref { background: rgba(59,130,246,0.15); color: #3b82f6; }
        
        .clickable-list { max-height: 180px; overflow-y: auto; }
        
        .clickable-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .clickable-item:hover { background: rgba(255,255,255,0.1); transform: translateX(3px); }
        
        .clickable-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .clickable-item .name { font-size: 12px; flex: 1; }
        .clickable-item .badge { font-size: 9px; background: rgba(124,58,237,0.3); color: #a78bfa; padding: 2px 6px; border-radius: 4px; }
        .clickable-item .count-badge { font-size: 9px; background: rgba(0,212,255,0.2); color: #00d4ff; padding: 2px 6px; border-radius: 4px; }
        .clickable-item .unit-badge { font-size: 9px; background: rgba(236,72,153,0.2); color: #ec4899; padding: 2px 6px; border-radius: 4px; }
        .clickable-item .type-badge { font-size: 9px; background: rgba(16,185,129,0.2); color: #10b981; padding: 2px 6px; border-radius: 4px; }
        
        .quick-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .stat-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px 8px; text-align: center; }
        .stat-value { display: block; font-size: 18px; font-weight: bold; color: #00d4ff; }
        .stat-label { display: block; font-size: 9px; color: #888; text-transform: uppercase; margin-top: 2px; }
        
        .tag.clickable { cursor: pointer; transition: all 0.2s; }
        .tag.clickable:hover { filter: brightness(1.2); transform: translateY(-1px); }
        
        code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
        
        /* Graph node styles */
        .node { cursor: pointer; }
        .node circle { stroke: #fff; stroke-width: 2px; transition: all 0.2s; }
        .node circle:hover { stroke-width: 3px; filter: brightness(1.2) drop-shadow(0 0 8px currentColor); }
        .node.selected circle { stroke: #fff; stroke-width: 4px; filter: drop-shadow(0 0 12px currentColor); }
        .node.dimmed { opacity: 0.15; }
        .node text { font-size: 11px; fill: #fff; pointer-events: none; }
        .link { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 1.5px; }
        
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            max-width: 280px;
        }
        
        .tooltip .tt-name { color: #00d4ff; font-weight: 600; margin-bottom: 3px; }
        .tooltip .tt-label { color: #ccc; font-size: 11px; margin-bottom: 5px; }
        .tooltip .tt-hint { color: #666; font-size: 10px; }
        
        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,15,35,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-overlay.hidden { display: none; }
        
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text { margin-top: 20px; color: #888; font-size: 14px; }
        .loading-status { margin-top: 8px; color: #00d4ff; font-size: 12px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        
        /* Responsive */
        @media (max-width: 900px) {
            .info-panel { position: absolute; right: 0; top: 0; height: 100%; z-index: 100; width: 100%; max-width: 380px; }
            .panel-toggle { right: 0; }
            .legend { display: none; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .quick-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Carregando ontologia do GitHub...</div>
        <div class="loading-status" id="loading-status">Conectando...</div>
    </div>

    <div class="header">
        <h1>🔋 EDO - Energy Domain Ontology</h1>
        <span class="version" id="version">v0.0.0</span>
        <div class="header-right">
            <a class="github-link" href="https://github.com/energy-domain/edo" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </a>
            <button class="btn" onclick="loadOntology()">⟳ Recarregar</button>
        </div>
    </div>
    
    <!-- Tabs -->
    <div class="tabs-container">
        <div class="tab active" data-tab="dashboard">
            <span class="tab-icon">📊</span>
            <span>Dashboard</span>
        </div>
        <div class="tab" data-tab="ifc">
            <span class="tab-icon">🏗️</span>
            <span>IFC Mapping</span>
        </div>
        <div class="tab" data-tab="attributes">
            <span class="tab-icon">📋</span>
            <span>Atributos</span>
        </div>
        <div class="tab" data-tab="disciplines">
            <span class="tab-icon">🎯</span>
            <span>Disciplinas</span>
        </div>
        <div class="tab" data-tab="graph">
            <span class="tab-icon">🕸️</span>
            <span>Grafo</span>
        </div>
    </div>
    
    <div class="main-content">
        <!-- Dashboard Tab -->
        <div class="tab-content active" id="tab-dashboard">
            <div class="dashboard" id="dashboard-content">
                <!-- Preenchido por JS -->
            </div>
        </div>
        
        <!-- IFC Tab -->
        <div class="tab-content" id="tab-ifc">
            <div class="dashboard" id="ifc-content">
                <!-- Preenchido por JS -->
            </div>
        </div>
        
        <!-- Attributes Tab -->
        <div class="tab-content" id="tab-attributes">
            <div class="dashboard" id="attributes-content">
                <!-- Preenchido por JS -->
            </div>
        </div>
        
        <!-- Disciplines Tab -->
        <div class="tab-content" id="tab-disciplines">
            <div class="dashboard" id="disciplines-content">
                <!-- Preenchido por JS -->
            </div>
        </div>
        
        <!-- Graph Tab -->
        <div class="tab-content" id="tab-graph">
            <div class="graph-controls">
                <button class="btn active" id="btn-tree">📊 Árvore</button>
                <button class="btn" id="btn-radial">🎯 Radial</button>
                <button class="btn" id="btn-force">🕸️ Rede</button>
                <span style="color:#333">|</span>
                <button class="btn" id="btn-zoom-in">➕</button>
                <button class="btn" id="btn-zoom-out">➖</button>
                <button class="btn" id="btn-reset">🔄</button>
                <input type="text" class="search-input" id="search" placeholder="🔍 Buscar classes..." style="max-width:200px;">
                
                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background:#7c3aed"></div>IFC</div>
                    <div class="legend-item"><div class="legend-color" style="background:#00d4ff"></div>Asset</div>
                    <div class="legend-item"><div class="legend-color" style="background:#10b981"></div>Element</div>
                    <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div>Attribute</div>
                </div>
            </div>
            
            <div class="graph-main">
                <div class="graph-container">
                    <svg id="graph"></svg>
                    <button class="panel-toggle" id="panel-toggle">◀</button>
                </div>
                
                <div class="info-panel" id="info-panel">
                    <div class="panel-content" id="panel-content">
                        <div class="empty-state">
                            <div class="icon">👆</div>
                            <p>Clique em um nó para ver<br>informações detalhadas</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip" style="display:none;"></div>

    <script>
    // =====================================================
    // EDO Ontology Viewer with Dashboards
    // =====================================================
    
    const ONTOLOGY_URL = 'https://raw.githubusercontent.com/energy-domain/edo/edo_develop/core/energy-domain-ontology.ttl';
    
    const colors = {
        root: '#e11d48',
        ifc_mapped: '#7c3aed',
        asset: '#00d4ff',
        element: '#10b981',
        attribute: '#f59e0b',
        other: '#6b7280'
    };
    
    const categoryLabels = {
        root: 'Root', ifc_mapped: 'IFC Mapped', asset: 'Asset',

    // =====================================================
    // Parser Turtle
    // =====================================================
    
    function parseTurtle(content) {
        const classes = {};
        
        const versionMatch = content.match(/owl:versionInfo\s+"([^"]+)"/);
        if (versionMatch) document.getElementById('version').textContent = versionMatch[1];
        
        const classPattern = /###\s+https:\/\/w3id\.org\/energy-domain\/edo#(\w+)\s*\n(edo:\1[\s\S]*?)(?=###|$)/g;
        
        let match;
        while ((match = classPattern.exec(content)) !== null) {
            const className = match[1];
            const block = match[2];
            
            if (!block.includes('rdf:type owl:Class')) continue;
            
            const subclassMatches = [...block.matchAll(/rdfs:subClassOf\s+edo:(\w+)/g)].map(m => m[1]);
            const labelEn = block.match(/skos:prefLabel\s+"([^"]+)"@en/)?.[1];
            const labelPt = block.match(/skos:prefLabel\s+"([^"]+)"@pt-br/)?.[1];
            const defEn = block.match(/skos:definition\s+"([^"]+)"@en/)?.[1];
            const defPt = block.match(/skos:definition\s+"([^"]+)"@pt-br/)?.[1];
            const altLabelsEn = [...block.matchAll(/skos:altLabel\s+"([^"]+)"@en/g)].map(m => m[1]);
            const altLabelsPt = [...block.matchAll(/skos:altLabel\s+"([^"]+)"@pt-br/g)].map(m => m[1]);
            const scopeNote = block.match(/skos:scopeNote\s+"([^"]+)"/)?.[1];
            const example = block.match(/skos:example\s+"([^"]+)"/)?.[1];
            const comment = block.match(/rdfs:comment\s+"([^"]+)"/)?.[1];
            
            const ifcClass = block.match(/ifc_equivalentClass\s+"([^"]+)"/)?.[1];
            const ifcObjType = block.match(/ifc_objectType\s+"([^"]+)"/)?.[1];
            const ifcPredef = block.match(/ifc_predefinedType\s+"([^"]+)"/)?.[1];
            
            const attributes = [...block.matchAll(/edo:hasAttribute\s+edo:(\w+)/g)].map(m => m[1]);
            const disciplines = [...block.matchAll(/edo:hasDiscipline\s+edo:(\w+)/g)].map(m => m[1]);
            const extRefs = [...block.matchAll(/edo:hasExternalRef\s+"([^"]+)"/g)].map(m => m[1]);
            
            const unit = block.match(/edo:hasUnit\s+unit:(\w+)/)?.[1];
            const dataType = block.match(/edo:hasTypedValue\s+edo:(\w+)/)?.[1];
            const status = block.match(/edo:entityStatus\s+"([^"]+)"/)?.[1];
            const scope = block.match(/edo:hasAttributeScope\s+edo:(\w+)/)?.[1];
            const identifier = block.match(/dcterms:identifier\s+"([^"]+)"/)?.[1];
            const source = block.match(/dcterms:source\s+"([^"]+)"/)?.[1];
            
            let category = 'other';
            if (subclassMatches.includes('DomainAttribute') || className.endsWith('Attribute') || dataType) {
                category = 'attribute';
            } else if (ifcClass) {
                category = 'ifc_mapped';
            } else if (subclassMatches.some(p => ['Asset', 'CompactObject', 'LinearObject', 'Equipment'].includes(p))) {
                category = 'asset';
            } else if (subclassMatches.some(p => ['DomainElement', 'Location', 'Spec', 'CommissioningElement'].includes(p))) {
                category = 'element';
            }
            
            classes[className] = {
                id: className,
                label_en: labelEn || className,
                label_pt: labelPt,
                definition_en: defEn,
                definition_pt: defPt,
                altLabels_en: altLabelsEn,
                altLabels_pt: altLabelsPt,
                altLabels: [...altLabelsEn, ...altLabelsPt],
                scopeNote, example, comment,
                parents: subclassMatches,
                ifc: ifcClass ? { equivalentClass: ifcClass, objectType: ifcObjType, predefinedType: ifcPredef } : null,
                attributes, disciplines, externalRefs: extRefs,
                unit, dataType, status, scope, identifier, source,
                category,
                uri: `https://w3id.org/energy-domain/edo#${className}`,
                children: []
            };
        }
        return classes;
    }
    
    // =====================================================
    // Build Tree
    // =====================================================
    
    function buildTree(classes) {
        const childrenMap = {};
        Object.keys(classes).forEach(name => childrenMap[name] = []);
        
        Object.entries(classes).forEach(([name, cls]) => {
            cls.parents.forEach(parent => {
                if (childrenMap[parent]) childrenMap[parent].push(name);
            });
        });
        
        Object.keys(classes).forEach(name => classes[name].children = childrenMap[name] || []);
        
        function buildNode(name, depth = 0, maxDepth = 4) {
            if (depth > maxDepth || !classes[name]) return null;
            const cls = classes[name];
            const node = { name: name, data: cls };
            
            const children = childrenMap[name] || [];
            if (children.length > 0 && depth < maxDepth) {
                node.children = [];
                const maxChildren = depth === 0 ? 10 : (depth === 1 ? 15 : 20);
                children.sort().slice(0, maxChildren).forEach(childName => {
                    const childNode = buildNode(childName, depth + 1, maxDepth);
                    if (childNode) node.children.push(childNode);
                });
            }
            return node;
        }
        
        const root = {
            name: 'EDO',
            data: {
                id: 'EDO',
                label_en: 'Energy Domain Ontology',
                label_pt: 'Ontologia do Domínio de Energia',
                definition_en: 'An ontology designed to represent the energy domain with semantic richness.',
                category: 'root',
                uri: 'https://w3id.org/energy-domain/edo',
                children: ['DomainElement', 'DomainAttribute', 'DomainClassification']
            },
            children: []
        };
        
        ['DomainElement', 'DomainAttribute', 'DomainClassification'].forEach(rootName => {
            if (classes[rootName]) {
                const node = buildNode(rootName, 0, 3);
                if (node) root.children.push(node);
            }
        });
        
        return root;
    }

            </div>
            
            <div class="dashboard-card">
                <h3>🎯 Classes por Disciplina</h3>
                ${sortedDisciplines.map(([disc, classes]) => `
                    <div class="progress-item">
                        <div class="progress-header">
                            <span class="progress-label">${disc}</span>
                            <span class="progress-value">${classes.length} classes</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${classes.length/sortedDisciplines[0][1].length*100}%; background: linear-gradient(90deg, #00d4ff, #7c3aed);"></div>
                        </div>
                    </div>
                `).join('')}
            </div>
            
            <div class="dashboard-card">
                <h3>📋 Detalhamento por Disciplina</h3>
                <table class="data-table">
                    <thead>
                        <tr><th>Disciplina</th><th>Classes</th><th>Com IFC</th><th>Exemplos</th></tr>
                    </thead>
                    <tbody>
                        ${sortedDisciplines.map(([disc, cls]) => `
                            <tr>
                                <td><span class="table-tag" style="background: #10b98130; color: #10b981;">${disc}</span></td>
                                <td><strong>${cls.length}</strong></td>
                                <td>${cls.filter(c => c.ifc).length}</td>
                                <td>${cls.slice(0, 3).map(c => c.id).join(', ')}${cls.length > 3 ? '...' : ''}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    
    // =====================================================
    // Graph Functions (same as before but condensed)
    // =====================================================
    
    function getColor(d) {
        const data = d.data?.data || d.data || d;
        return colors[data.category] || colors.other;
    }
    
    function getLabel(d) {
        const data = d.data?.data || d.data || d;
        return data.label_en || data.id || d.name;
    }
    
    function initSvg() {
        svg.selectAll('*').remove();
        const width = svg.node()?.clientWidth || 800;
        const height = svg.node()?.clientHeight || 600;
        
        zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', (event) => g.attr('transform', event.transform));
        svg.call(zoom);
        g = svg.append('g');
        return { width, height };
    }
    
    function showTooltip(event, d) {
        const data = d.data?.data || d.data || d;
        tooltip.html(`<div class="tt-name">${data.label_en || data.id || d.name}</div>
                      ${data.label_pt ? `<div class="tt-label">${data.label_pt}</div>` : ''}
                      <div class="tt-hint">Clique para ver detalhes</div>`)
            .style('display', 'block')
            .style('left', (event.pageX + 15) + 'px')
            .style('top', (event.pageY - 10) + 'px');
    }
    
    function hideTooltip() { tooltip.style('display', 'none'); }
    
    function drawTree() {
        if (!treeData) return;
        const { width, height } = initSvg();
        const root = d3.hierarchy(treeData);
        
        const treeLayout = d3.tree().nodeSize([24, 220]).separation((a, b) => a.parent === b.parent ? 1 : 1.5);
        treeLayout(root);
        
        let minY = Infinity, maxY = -Infinity;
        root.descendants().forEach(d => { if (d.x < minY) minY = d.x; if (d.x > maxY) maxY = d.x; });
        
        g.attr('transform', `translate(180, ${-minY + 40})`);
        
        g.selectAll('.link').data(root.links()).enter().append('path').attr('class', 'link')
            .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x));
        
        const nodes = g.selectAll('.node').data(root.descendants()).enter().append('g').attr('class', 'node')
            .attr('transform', d => `translate(${d.y}, ${d.x})`)
            .on('mouseover', showTooltip).on('mouseout', hideTooltip)
            .on('click', (event, d) => { event.stopPropagation(); selectNode(d); });
        
        nodes.append('circle').attr('r', d => d.depth === 0 ? 14 : (d.data?.data?.ifc ? 9 : 7)).attr('fill', d => getColor(d));
        nodes.append('text').attr('dx', d => d.children ? -14 : 14).attr('dy', 4)
            .attr('text-anchor', d => d.children ? 'end' : 'start')
            .text(d => { const l = getLabel(d); return l.length > 22 ? l.substring(0, 20) + '...' : l; }).style('font-size', '11px');
    }
    
    function drawRadialTree() {
        if (!treeData) return;
        const { width, height } = initSvg();
        const root = d3.hierarchy(treeData);
        const baseRadius = Math.min(width, height) / 2 - 180;
        
        d3.tree().size([2 * Math.PI, baseRadius])
            .separation((a, b) => { const baseSep = a.parent === b.parent ? 1 : 2; return baseSep * Math.max(1, 3 - (a.depth || 1)); })(root);
        
        g.attr('transform', `translate(${width/2}, ${height/2})`);
        
        g.selectAll('.link').data(root.links()).enter().append('path').attr('class', 'link')
            .attr('d', d3.linkRadial().angle(d => d.x).radius(d => d.y));
        
        const nodes = g.selectAll('.node').data(root.descendants()).enter().append('g').attr('class', 'node')
            .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y}, 0)`)
            .on('mouseover', showTooltip).on('mouseout', hideTooltip)
            .on('click', (event, d) => { event.stopPropagation(); selectNode(d); });
        
        nodes.append('circle').attr('r', d => d.depth === 0 ? 14 : (d.data?.data?.ifc ? 9 : 7)).attr('fill', d => getColor(d));
        nodes.append('text').attr('dx', d => d.x < Math.PI === !d.children ? 12 : -12).attr('dy', 3)
            .attr('text-anchor', d => d.x < Math.PI === !d.children ? 'start' : 'end')
            .attr('transform', d => d.x >= Math.PI ? 'rotate(180)' : null)
            .text(d => { const l = getLabel(d); return l.length > 18 ? l.substring(0, 16) + '...' : l; }).style('font-size', '10px');
    }
    
    function drawForceGraph() {
        if (!treeData) return;
        const { width, height } = initSvg();
        const nodes = [], links = [], nodeMap = {};
        
        function traverse(node, parent = null) {
            const id = node.name;
            if (!nodeMap[id]) { const n = { id, name: id, data: node.data?.data || node.data || node }; nodes.push(n); nodeMap[id] = n; }
            if (parent) links.push({ source: parent.name, target: id });
            if (node.children) node.children.forEach(c => traverse(c, node));
        }
        traverse(treeData);
        
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(80))
            .force('charge', d3.forceManyBody().strength(-200))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(30));
        
        const link = g.selectAll('.link').data(links).enter().append('line').attr('class', 'link');
        
        const node = g.selectAll('.node').data(nodes).enter().append('g').attr('class', 'node')
            .call(d3.drag()
                .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
            .on('mouseover', showTooltip).on('mouseout', hideTooltip)
            .on('click', (event, d) => { event.stopPropagation(); selectNode(d); });
        
        node.append('circle').attr('r', d => d.id === 'EDO' ? 16 : (d.data?.ifc ? 10 : 8)).attr('fill', d => colors[d.data?.category] || colors.other);
        node.append('text').attr('dx', 12).attr('dy', 4)
            .text(d => { const l = d.data?.label_en || d.id; return l.length > 15 ? l.substring(0,13)+'...' : l; }).style('font-size', '10px');
        
        simulation.on('tick', () => {
            link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
            node.attr('transform', d => `translate(${d.x}, ${d.y})`);
        });
    }
    
    function selectNode(d) {
        const data = d.data?.data || d.data || d;
        const nodeName = data.id || d.name;
        
        d3.selectAll('.node').classed('selected', false);
        d3.selectAll('.node').filter(n => { const nData = n.data?.data || n.data || n; return (nData.id || n.name) === nodeName; }).classed('selected', true);
        selectedNode = nodeName;
        showNodeInfo(data);
    }
    
    function showNodeInfo(data) {
        const color = colors[data.category] || colors.other;
        const nodeData = classes[data.id] || data;
        
        const childCount = nodeData.children?.length || 0;
        const totalDescendants = countDescendants(data.id);
        const depth = calculateDepth(data.id);
        const isLeaf = childCount === 0;
        const hasIfc = !!nodeData.ifc;
        
        let html = `
            <div class="panel-header">
                <div class="panel-icon" style="background: ${color}25; color: ${color};">${hasIfc ? '🔗' : isLeaf ? '🍃' : '📦'}</div>
                <div class="panel-title"><h2>${data.label_en || data.id}</h2><div class="class-id">${data.id}</div></div>
            </div>
            
            <div class="info-section">
                <div class="quick-stats">
                    <div class="stat-item"><span class="stat-value">${childCount}</span><span class="stat-label">Subclasses</span></div>
                    <div class="stat-item"><span class="stat-value">${totalDescendants}</span><span class="stat-label">Total Desc.</span></div>
                    <div class="stat-item"><span class="stat-value">${depth}</span><span class="stat-label">Nível</span></div>
                    <div class="stat-item"><span class="stat-value">${nodeData.attributes?.length || 0}</span><span class="stat-label">Atributos</span></div>
                </div>
            </div>
            
            <div class="info-section">
                <h3>📋 Identificação</h3>
                <div class="info-item"><label>Categoria</label><div class="value">
                    <span class="category-badge" style="background: ${color}25; color: ${color};">${categoryLabels[data.category] || data.category}</span>
                    ${isLeaf ? '<span class="category-badge" style="background: #10b98125; color: #10b981; margin-left: 5px;">Folha</span>' : ''}
                    ${hasIfc ? '<span class="category-badge" style="background: #7c3aed25; color: #7c3aed; margin-left: 5px;">IFC</span>' : ''}
                </div></div>
                ${data.label_pt ? `<div class="info-item"><label>Nome em Português</label><div class="value">${data.label_pt}</div></div>` : ''}
                <div class="info-item"><label>URI</label><div class="value uri"><a href="${data.uri}" target="_blank" style="color: #00d4ff; text-decoration: none;">${data.uri} ↗</a></div></div>
            </div>
        `;
        
        if (data.definition_en || data.definition_pt) {
            html += `<div class="info-section"><h3>📝 Definição</h3>`;
            if (data.definition_en) html += `<div class="info-item"><label>🇬🇧 English</label><div class="value">${data.definition_en}</div></div>`;
            if (data.definition_pt) html += `<div class="info-item"><label>🇧🇷 Português</label><div class="value">${data.definition_pt}</div></div>`;
            html += `</div>`;
        }
        
        if (nodeData.ifc) {
            html += `<div class="info-section"><h3>🏗️ Mapeamento IFC</h3>
                <div class="ifc-badge">📦 ${nodeData.ifc.equivalentClass}</div>
                <div class="ifc-details">
                    <div class="ifc-detail"><label>ObjectType</label><span>${nodeData.ifc.objectType || '—'}</span></div>
                    <div class="ifc-detail"><label>PredefinedType</label><span>${nodeData.ifc.predefinedType || '—'}</span></div>
                </div></div>`;
        }
        
        const parents = nodeData.parents || [];
        if (parents.length > 0) {
            html += `<div class="info-section"><h3>⬆️ Classes Pai (${parents.length})</h3><div class="clickable-list">`;
            parents.forEach(p => {
                const pData = classes[p];
                html += `<div class="clickable-item" onclick="navigateToClass('${p}')">
                    <div class="dot" style="background: ${pData ? colors[pData.category] : colors.other};"></div>
                    <span class="name">${pData?.label_en || p}</span>
                    ${pData?.ifc ? `<span class="badge">${pData.ifc.equivalentClass}</span>` : ''}
                </div>`;
            });
            html += `</div></div>`;
        }
        
        const children = nodeData.children || [];
        if (children.length > 0) {
            html += `<div class="info-section"><h3>⬇️ Subclasses (${children.length})</h3><div class="clickable-list">`;
            children.slice(0, 30).forEach(c => {
                const cData = classes[c];
                html += `<div class="clickable-item" onclick="navigateToClass('${c}')">
                    <div class="dot" style="background: ${cData ? colors[cData.category] : colors.other};"></div>
                    <span class="name">${cData?.label_en || c}</span>
                    ${cData?.children?.length ? `<span class="count-badge">${cData.children.length}</span>` : ''}
                    ${cData?.ifc ? `<span class="badge">${cData.ifc.equivalentClass}</span>` : ''}
                </div>`;
            });
            if (children.length > 30) html += `<div style="color:#666;font-size:11px;padding:8px;text-align:center;">...e mais ${children.length - 30}</div>`;
            html += `</div></div>`;
        }
        
        if (nodeData.attributes?.length > 0) {
            html += `<div class="info-section"><h3>📊 Atributos (${nodeData.attributes.length})</h3><div class="clickable-list">`;
            nodeData.attributes.forEach(a => {
                const aData = classes[a];
                html += `<div class="clickable-item" onclick="navigateToClass('${a}')">
                    <div class="dot" style="background: #f59e0b;"></div>
                    <span class="name">${aData?.label_en || a}</span>
                    ${aData?.unit ? `<span class="unit-badge">${aData.unit}</span>` : ''}
                </div>`;
            });
            html += `</div></div>`;
        }
        
        if (nodeData.disciplines?.length > 0) {
            html += `<div class="info-section"><h3>🎯 Disciplinas</h3><div>${nodeData.disciplines.map(d => `<span class="tag discipline">${d}</span>`).join('')}</div></div>`;
        }
        
        if (nodeData.externalRefs?.length > 0) {
            html += `<div class="info-section"><h3>🔗 Referências Externas</h3><div>${nodeData.externalRefs.map(r => `<span class="tag ref">${r}</span>`).join('')}</div></div>`;
        }
        
        if (nodeData.status) {
            const statusColor = nodeData.status === 'NEW' ? '#10b981' : '#f59e0b';
            html += `<div class="info-section"><h3>📄 Status</h3><span class="tag" style="background: ${statusColor}25; color: ${statusColor};">${nodeData.status}</span></div>`;
        }
        
        document.getElementById('panel-content').innerHTML = html;
    }
    
    function countDescendants(classId) {
        const cls = classes[classId];
        if (!cls || !cls.children || cls.children.length === 0) return 0;
        let count = cls.children.length;
        cls.children.forEach(childId => { count += countDescendants(childId); });
        return count;
    }
    
    function calculateDepth(classId) {
        const cls = classes[classId];
        if (!cls || !cls.parents || cls.parents.length === 0) return 0;
        let maxDepth = 0;
        cls.parents.forEach(parentId => { const d = calculateDepth(parentId); if (d + 1 > maxDepth) maxDepth = d + 1; });
        return maxDepth;
    }
    
    function navigateToClass(name) {
        if (classes[name]) {
            document.querySelector('[data-tab="graph"]').click();
            setTimeout(() => {
                d3.selectAll('.node').each(function(d) {
                    const data = d.data?.data || d.data || d;
                    if ((data.id || d.name) === name) selectNode(d);
                });
            }, 200);
        }
    }
    
    // =====================================================
    // Event Listeners
    // =====================================================
    
    document.getElementById('btn-tree').addEventListener('click', () => {
        document.querySelectorAll('.graph-controls .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-tree').classList.add('active');
        currentView = 'tree'; drawTree();
    });
    
    document.getElementById('btn-radial').addEventListener('click', () => {
        document.querySelectorAll('.graph-controls .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-radial').classList.add('active');
        currentView = 'radial'; drawRadialTree();
    });
    
    document.getElementById('btn-force').addEventListener('click', () => {
        document.querySelectorAll('.graph-controls .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-force').classList.add('active');
        currentView = 'force'; drawForceGraph();
    });
    
    document.getElementById('btn-zoom-in').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1.3));
    document.getElementById('btn-zoom-out').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 0.7));
    document.getElementById('btn-reset').addEventListener('click', () => {
        svg.transition().call(zoom.transform, d3.zoomIdentity);
        if (currentView === 'tree') drawTree();
        else if (currentView === 'radial') drawRadialTree();
        else drawForceGraph();
    });
    
    document.getElementById('panel-toggle').addEventListener('click', function() {
        document.getElementById('info-panel').classList.toggle('collapsed');
        this.classList.toggle('collapsed');
        this.textContent = this.classList.contains('collapsed') ? '▶' : '◀';
    });
    
    document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        d3.selectAll('.node').each(function(d) {
            const data = d.data?.data || d.data || d;
            const matches = query === '' || (data.id || d.name || '').toLowerCase().includes(query) || (data.label_en || '').toLowerCase().includes(query);
            d3.select(this).classed('dimmed', !matches);
        });
    });
    
    svg.on('click', () => {
        selectedNode = null;
        d3.selectAll('.node').classed('selected', false);
        document.getElementById('panel-content').innerHTML = `<div class="empty-state"><div class="icon">👆</div><p>Clique em um nó para ver<br>informações detalhadas</p></div>`;
    });
    
    window.addEventListener('resize', () => {
        if (document.getElementById('tab-graph').classList.contains('active')) {
            if (currentView === 'tree') drawTree();
            else if (currentView === 'radial') drawRadialTree();
            else drawForceGraph();
        }
    });
    
    // =====================================================
    // Load Ontology
    // =====================================================
    
    async function loadOntology() {
        const loading = document.getElementById('loading');
        const loadingStatus = document.getElementById('loading-status');
        
        loading.classList.remove('hidden');
        loadingStatus.textContent = 'Conectando ao GitHub...';
        
        try {
            loadingStatus.textContent = 'Baixando ontologia...';
            const response = await fetch(ONTOLOGY_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            loadingStatus.textContent = 'Parseando Turtle...';
            const content = await response.text();
            
            loadingStatus.textContent = 'Construindo estrutura...';
            classes = parseTurtle(content);
            treeData = buildTree(classes);
            
            loadingStatus.textContent = 'Renderizando dashboards...';
            renderDashboard();
            renderIfcDashboard();
            renderAttributesDashboard();
            renderDisciplinesDashboard();
            
            loading.classList.add('hidden');
            
        } catch (error) {
            console.error('Error loading ontology:', error);
            loadingStatus.textContent = `Erro: ${error.message}`;
        }
    }
    
    // Start
    loadOntology();
    </script>
</body>
</html>
